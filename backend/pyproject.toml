[project]
name = "advisor-ai-backend"
version = "0.1.0"
description = "Multimodal AI academic advisor — COSC 490 senior project"
requires-python = ">=3.11,<3.15"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pyyaml>=6.0",
    "networkx>=3.4",
    "scipy>=1.14",
    "python-multipart>=0.0.12",
    # Access tokens. Password hashing uses stdlib hashlib.scrypt, so this is
    # the only dependency authentication adds.
    "pyjwt>=2.10",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
ingestion = [
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
    "pillow>=11.0",
]
llm = [
    "anthropic>=0.40",
    "openai>=1.57",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "black>=24.10",
    "pre-commit>=4.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
