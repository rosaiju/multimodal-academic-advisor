# Dates a Morgan State student plans around.
#
# SOURCED, NOT GUESSED. Every item below was read from the Morgan page named in its
# `source` on the `retrieved` date. Nothing is estimated and nothing is generated.
# Morgan's own pages say the dates are subject to change, so the UI repeats that.
#
# What this file does NOT have, and why: the official academic calendar (classes
# begin, add/drop, last day to withdraw, finals, apply-for-graduation) is a Google
# Doc linked from the registrar's page, and could not be read. Those dates are
# listed under `not_yet_sourced` so the UI can say "go and look" instead of showing
# a gap that looks like "no deadline". Add them here once someone reads the doc.

version: 1
institution: Morgan State University
retrieved: "2026-11-04"

# Registration group by earned credits, as the registrar's page defines them.
# A student's own group is chosen from their earned credits, which INCLUDE transfer
# credit. Honors students, athletes, veterans and SDSS students also register in the
# first window regardless of standing, and the engine cannot know that about anyone.
standings:
  - {id: senior, label: "Senior (90+ earned credits)", min_credits: 90}
  - {id: junior, label: "Junior (56 to 89 earned credits)", min_credits: 56}
  - {id: sophomore, label: "Sophomore (25 to 55 earned credits)", min_credits: 25}
  - {id: freshman, label: "Freshman (0 to 24 earned credits)", min_credits: 0}

