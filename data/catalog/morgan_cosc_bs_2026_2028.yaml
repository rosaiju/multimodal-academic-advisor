requirement_blocks:
  # Encoded ONLY where [PLANNER] and [SEQ] agree, or where [PLANNER] states a
  # requirement that no other official page contradicts.

  - id: major_required_courses
    name: Required Courses for Computer Science Major
    type: all_of
    courses: [COSC111, COSC112, COSC220, COSC243, COSC281, COSC349,
              COSC351, COSC352, COSC354, COSC458, COSC459, COSC490]
    min_grade: C
    source: >-
      [PLANNER] heading "Required Courses for Computer Science Major", course list.
      All twelve also appear in [SEQ]. The heading's CREDIT TOTAL is disputed
      (65 there, 59 elsewhere) and is deliberately not encoded - only the course
      list is, because both sources agree on it.
    note: >-
      [PLANNER]: "students must complete the courses listed below with grades of
      'C' or higher".

  - id: supporting_courses
    name: Supporting Courses
    type: all_of
    courses: [MATH241, MATH242, MATH312, MATH331, COSC201]
    min_grade: C
    source: >-
      [PLANNER] heading "Supporting Courses 11 credits". The 11 reconciles exactly
      when starred MATH241 (4 cr) is counted under General Education instead:
      4+3+3+1 = 11. That arithmetic confirms how the starred-course rule works.

  - id: gen_ed_composition
    name: General Education - English Composition
    type: n_of
    n: 2
    courses: [ENGL101, ENGL111, ENGL102, ENGL112]
    source: >-
      [GENED] category "EC (English Composition) - 6 credits", Part A
      (ENGL 101 or ENGL 111) and Part B (ENGL 102 or ENGL 112). [PLANNER] lists
      the same four with the same OR structure.
    note: >-
      n_of cannot express "one from Part A AND one from Part B" - a student taking
      ENGL101 and ENGL111 would satisfy this block but not the requirement. Needs
      two separate blocks once the schema supports paired OR-groups.
    advisor_approval_required: true

  - id: first_year_seminar
    name: University First-Year Seminar
    type: all_of
    courses: [UNIV101]
    source: >-
      [PLANNER] "UNIV 101 - University First-Year Seminar, 1 credits", listed under
      General Education and University Requirements. [SEQ] places it in First Year,
      Semester One. ORNS 106 appears in NEITHER source.

  - id: cumulative_gpa
    name: Minimum Cumulative GPA
    type: gpa
    min_gpa: 2.0
    scope: cumulative
    source: '[PLANNER] "Cumulative average of 2.0 or better"'

  - id: major_gpa
    name: Minimum Major GPA
    type: gpa
    min_gpa: 2.0
    scope: major
    source: >-
      [PLANNER] "a major average of 2.0 or better" and "No outstanding grades
      below 'C' in the major".

