# Morgan State University - B.S. Computer Science - 2026-2028 Undergraduate Catalog
#
# Morgan publishes BIENNIAL catalogs. There is no 2026-2027 edition.
#
# SOURCES (every requirement below cites one of these in its `source` field)
#   [PLANNER] catalog.morgan.edu/preview_degree_planner.php?catoid=28&poid=6521
#             "Computer Science, B.S." degree requirements - the primary source.
#   [SEQ]     catalog.morgan.edu/preview_degree_planner.php?catoid=28&poid=6630
#             "Computer Science Curriculum Sequence" - the suggested 4-year plan.
#   [GENED]   catalog.morgan.edu/preview_degree_planner.php?catoid=28&poid=6522
#             University General Education Requirements.
#   [COURSE]  catalog.morgan.edu/preview_course_nopop.php?catoid=28&coid=N
#             Individual course records - used ONLY for prerequisite text.
#
# TITLE NORMALIZATION (the only edit applied to any transcribed value)
#   [PLANNER] appends general-education category tags to some titles and uses a
#   non-ASCII dash. Tags are stripped and the dash normalized to " - ". Affects
#   exactly three rows; credits and codes are never altered:
#     ENGL102  source "Composition II (EC)"       -> "Composition II"
#     ENGL111  source "Composition I<dash>Honors EC"  -> "Composition I - Honors"
#     ENGL112  source "Composition II<dash>Honors (EC)" -> "Composition II - Honors"
#
# Course codes, titles and credits are transcribed from [PLANNER]. Prerequisites
# come from [COURSE]. Where no source was consulted, the field is ABSENT and the
# course carries a comment saying so - never a guess.
#
# STATUS: course layer sourced; disputed requirement blocks NOT encoded.
#   [PLANNER] and [SEQ] are both official and they contradict each other on
#   elective group membership and on how many courses each group needs. Those
#   blocks stay out until the department resolves them.
#   See docs/catalog-open-questions.md.
#
# *** DATA, not advice. The LLM never reads this to compute progress; the audit
#     engine does. See tests/test_no_llm_in_engine.py. ***

